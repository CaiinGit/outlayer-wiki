server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8000;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass $api_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
    location = /data/codex.json {
        proxy_pass $api_backend;
        proxy_set_header Host $http_host;
    }
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location = /admin { return 302 /admin/; }
    location = /admin/ { try_files /admin/index.html =404; add_header Cache-Control "no-store"; }
    location ~ ^/(index\.html|styles\.css|app\.js|catalog\.js|entry-view\.js|admin/(admin\.js|admin\.css))$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ { try_files $uri =404; expires 1h; }
    location / { return 404; }
}
